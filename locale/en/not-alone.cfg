[item-description]
not-alone-command-tool=Drag to select your deployed team mates. Right-drag to set a destination. Shift-right-drag to add waypoints.
not-alone-miner=Store in a Habitat to deploy. Mines resources marked with a deconstruction planner within its network coverage.
not-alone-builder=Store in a Habitat to deploy. Builds marked ghosts and deconstructs marked entities within its network coverage.
not-alone-soldier=Store in a Habitat to deploy. Hunts enemies within its network's coverage, collecting weapon kits and ammo from logistics storage. Fights with the best armed weapon, falling back tier by tier as ammo runs out, and punches only when no ammo can be had anywhere.
not-alone-soldier-smg=Place in logistics storage. A Soldier will collect it and add a submachine gun to its arsenal.
not-alone-soldier-shotgun=Place in logistics storage. A Soldier will collect it and add a shotgun to its arsenal.
not-alone-soldier-combat-shotgun=Place in logistics storage. A Soldier will collect it and add a combat shotgun to its arsenal.
not-alone-soldier-flamethrower=Place in logistics storage. A Soldier will collect it and add a flamethrower to its arsenal.
not-alone-soldier-rocket=Place in logistics storage. A Soldier will collect it and add a rocket launcher to its arsenal.
not-alone-carrier=Store in a Habitat to deploy. Hauls items from provider and storage chests to any requester within its network coverage, like a logistic robot.
not-alone-logistics-hub=Creates logistic-network coverage without power or robot charging and stores Miners, Builders, Soldiers, and Carriers.
