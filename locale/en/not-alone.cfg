[item-description]
not-alone-command-tool=Drag to select your deployed team mates. Right-drag to set a destination. Shift-right-drag to add waypoints.
not-alone-miner=Store in a Habitat to deploy. Mines resources marked with a deconstruction planner within its network coverage.
not-alone-builder=Store in a Habitat to deploy. Builds marked ghosts and deconstructs marked entities within its network coverage.
not-alone-soldier=Store in a Habitat to deploy. Has no active duties yet.
not-alone-logistics-hub=Creates logistic-network coverage without power or robot charging and stores Miners, Builders, and Soldiers.
